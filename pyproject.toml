[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overlap-vec2text-poc"
version = "0.1.0"
description = "Small PoC for joint reranking of overlapping RAG chunk inversions"
requires-python = ">=3.10,<3.12"
dependencies = [
  "Faker==39.1.0",
  "PyYAML==6.0.3",
  "accelerate==0.23.0",
  "bert-score==0.3.13",
  "datasets==2.14.6",
  "einops==0.8.2",
  "evaluate==0.4.1",
  "huggingface-hub==0.17.3",
  "nltk==3.10.3",
  "numpy==1.26.4",
  "openai==3.6.0",
  "optimum==2.3.0",
  "pyarrow==13.0.0",
  "responses==0.18.0",
  "rouge-score==0.1.2",
  "sacrebleu==2.4.0",
  "sentence-transformers==2.2.2",
  "sentencepiece==0.2.2",
  "tenacity==9.1.4",
  "tokenizers==0.14.1",
  "torch==2.12.1+cu130",
  "torchvision==0.27.1+cu130",
  "tqdm==4.70.0",
  "transformers==4.34.1",
  "vec2text==0.0.13",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
